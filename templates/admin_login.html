<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Photo Kiosk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Top Bar -->
    <header class="p-6">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <a href="/" class="text-xs text-slate-400 hover:text-amber-400 flex items-center space-x-2 transition">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Kiosk Portal</span>
            </a>
            <span class="text-[11px] text-slate-500 font-mono">Epson PM-520</span>
        </div>
    </header>

    <!-- Login Card -->
    <main class="flex-1 flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl shadow-black/50 space-y-6">
            
            <div class="text-center space-y-2">
                <div class="w-14 h-14 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-400 mx-auto flex items-center justify-center text-2xl shadow-inner">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1 class="text-xl font-bold text-white tracking-tight">Kiosk Operator Login</h1>
                <p class="text-xs text-slate-400">Enter the administrator password to manage hardware, inventory, and orders.</p>
            </div>

            {% if error %}
            <div class="p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center space-x-3">
                <i class="fa-solid fa-circle-exclamation text-rose-400 text-sm flex-shrink-0"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/admin/login" method="POST" class="space-y-4">
                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-300 mb-2">Admin Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 text-sm">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="password" id="password" name="password" required autofocus placeholder="Enter password"
                            class="w-full pl-10 pr-10 py-3 bg-slate-950 border border-slate-700 rounded-xl text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 text-sm focus:outline-none">
                            <i id="toggleEye" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="w-full py-3.5 px-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm rounded-xl shadow-lg shadow-amber-500/20 transition-all transform active:scale-98 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Unlock Operator Dashboard</span>
                </button>
            </form>

            <div class="pt-4 border-t border-slate-800/80 text-center">
                <p class="text-[11px] text-slate-500">
                    Restricted Area &bull; Authorized Personnel Only
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="p-6 text-center text-xs text-slate-600">
        &copy; 2026 Smart Photo Kiosk System. All rights reserved.
    </footer>

    <script>
        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            const eye = document.getElementById('toggleEye');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                eye.classList.remove('fa-eye');
                eye.classList.add('fa-eye-slash');
            } else {
                pwd.type = 'password';
                eye.classList.remove('fa-eye-slash');
                eye.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
